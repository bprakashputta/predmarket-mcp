[project]
name = "predmarket-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents live Kalshi and Polymarket data: search, quotes, order books, trades, price history and cross-venue comparison."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bhanu Prakash Putta" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
predmarket-mcp = "predmarket_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmarket_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # a split string reads better than a 30-item list
